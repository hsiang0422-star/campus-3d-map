<style>
/* Layout: full-bleed 3D stage; floating toolbar top, legend left, detail sheet right (bottom sheet on phones). */
:root{
  --bg:#eef1ec; --panel:#ffffffee; --panel-solid:#ffffff; --fg:#22281f; --muted:#5d6658; --line:#d5dbd0;
  --accent:#1f6f8b; --accent-fg:#ffffff; --chip:#f3f5f1; --building:#f2c94c; --sel:#e8793a;
  --route:#2b6cb0;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171b17; --panel:#232823ee; --panel-solid:#232823; --fg:#eef1ea; --muted:#a7b0a2; --line:#3a4238;
  --accent:#6cc3df; --accent-fg:#0f2028; --chip:#2d332c; --route:#7cb6f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b17; --panel:#232823ee; --panel-solid:#232823; --fg:#eef1ea; --muted:#a7b0a2; --line:#3a4238;
  --accent:#6cc3df; --accent-fg:#0f2028; --chip:#2d332c; --route:#7cb6f0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.blabel{position:absolute;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;background:var(--panel-solid);color:var(--fg);
  font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--line);box-shadow:0 2px 6px #0002;pointer-events:auto;cursor:pointer}
.blabel.sel{background:var(--sel);color:#fff;border-color:transparent}
.blabel small{font-weight:500;opacity:.75;margin-left:4px}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;pointer-events:none}
header>*{pointer-events:auto}
h1{margin:0;font-size:20px;font-weight:700;text-wrap:balance;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--line)}
h1 span{font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#legend{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:228px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
#legend h2,#info h2{margin:0 0 2px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.fac{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;text-align:left;padding:5px 8px;background:var(--chip);border-color:transparent}
.fac img{width:24px;height:24px}
.fac .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.fac[aria-pressed="false"]{opacity:.45}
.fac[aria-pressed="true"]{background:var(--chip);color:var(--fg);border-color:var(--accent)}
.routekey{display:flex;align-items:center;gap:8px}
.routekey i{width:28px;border-top:3px dotted var(--route)}
#info{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:270px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
#info h3{margin:0;font-size:18px}
#info p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
#info ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
#info li{display:flex;align-items:center;gap:8px;font-size:13px}
#info li img{width:20px;height:20px}
.note{font-size:11px;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;display:none;white-space:nowrap}
@media (max-width:720px){
  h1{font-size:16px} h1 span{display:none}
  .tools{gap:4px} button{padding:5px 8px;font-size:12px}
  #legend{width:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:8px}
  #legend h2,.routekey,#legend .note{display:none}
  #facList{grid-template-columns:repeat(5,1fr)}
  .fac{grid-template-columns:1fr;justify-items:center;gap:2px;padding:5px 2px;font-size:10px}
  .fac img{width:24px;height:24px}.fac .n,.fac .full{display:none}.fac .short{display:inline!important}
  #info{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-height:45vh;overflow:auto;padding:10px}
  #info.ov{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

gtex.encoding = THREE.sRGBEncoding; gtex.anisotropy = renderer.capabilities.getMaxAnisotropy();
renderer.outputEncoding = THREE.sRGBEncoding;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(R.w,R.h), new THREE.MeshLambertMaterial({map:gtex}));
ground.rotation.x = -Math.PI/2;
const [gx,gz] = toW(R.x+R.w/2, R.y+R.h/2); ground.position.set(gx,0,gz);
ground.receiveShadow = true; scene.add(ground);
const base = new THREE.Mesh(new THREE.BoxGeometry(R.w,3,R.h), new THREE.MeshLambertMaterial({color:0xc9cfc3}));
base.position.set(gx,-1.51,gz); scene.add(base);

/* 建築 */
const buildings = [];
const pickables = [];
function ringToShape(ring){ const s=new THREE.Shape(); ring.forEach((p,i)=>{const [x,z]=toW(p[0],p[1]); i?s.lineTo(x,-z):s.moveTo(x,-z);}); return s; }
DATA.buildings.forEach(b=>{
  const floors = FLOORS[b.id]||1, h = b.id==='bus' ? 1.6 : floors*FLOOR_H;
  const group = new THREE.Group(); group.userData = {b, h, floors};
  const mat = new THREE.MeshStandardMaterial({color:b.id==='bus'?0xd8c9a0:0xf2c94c, roughness:.85, metalness:0, transparent:true, opacity:1});
  b.polys.forEach(poly=>{
    const shape = ringToShape(poly[0]);
    poly.slice(1).forEach(hole=>shape.holes.push(ringToShape(hole)));
    const geo = new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false});
    geo.rotateX(-Math.PI/2);
    const m = new THREE.Mesh(geo, mat); m.castShadow=true; m.receiveShadow=true; m.userData.building=group;
    group.add(m); pickables.push(m);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo,30), new THREE.LineBasicMaterial({color:0x6b5a2a,transparent:true,opacity:.55}));
    group.add(edges);
    // 樓板線
    const pts = poly[0].map(p=>{const [x,z]=toW(p[0],p[1]);return new THREE.Vector3(x,0,z);});
    for(let k=1;k<floors;k++){
      const g = new THREE.BufferGeometry().setFromPoints(pts.map(v=>v.clone().setY(k*FLOOR_H)));
      group.add(new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:0x8a7432,transparent:true,opacity:.45})));
    }
  });
  // 中心點（給標籤用）
  const ring = b.polys[0][0]; let sx=0,sy=0; ring.forEach(p=>{sx+=p[0];sy+=p[1];});
  const lp = labelPoint(b);
  const [lx,lz] = toW(lp[0],lp[1]);
  group.userData.anchor = new THREE.Vector3(lx,h+1.5,lz);
  group.userData.mat = mat;
  scene.add(group); buildings.push(group);
});
function labelPoint(b){ // 取建築內一個好放標籤的點：以面積最大的多邊形做網格取樣，找離邊最遠的點
  const ring=b.polys[0][0]; let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  ring.forEach(p=>{minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);});
  let best=[(minx+maxx)/2,(miny+maxy)/2],bd=-1;
  for(let x=minx;x<=maxx;x+=1)for(let y=miny;y<=maxy;y+=1){ if(!inRing(x,y,ring))continue; const d=distRing(x,y,ring); if(d>bd){bd=d;best=[x,y];} }
  return best;
}
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const [xi,yi]=r[i],[xj,yj]=r[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function distRing(x,y,r){let m=1e9;for(let i=0,j=r.length-1;i<r.length;j=i++){const [ax,ay]=r[j],[bx,by]=r[i];const dx=bx-ax,dy=by-ay;const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));m=Math.min(m,Math.hypot(x-ax-t*dx,y-ay-t*dy));}return m;}

/* 設施圖示 */
const iconTex = {}; for(const k in DATA.iconImg){ const t=new THREE.TextureLoader().load(DATA.iconImg[k]); t.encoding=THREE.sRGBEncoding; iconTex[k]=t; }
const facObjs = [];
const facCount = {};
DATA.icons.forEach((ic,idx)=>{
  facCount[ic.t]=(facCount[ic.t]||0)+1;
  // 找所屬建築
  let owner=null, near=null, nd=1e9;
  DATA.buildings.forEach((b,bi)=>{ b.polys.forEach(p=>{ if(inRing(ic.x,ic.y,p[0])) owner=buildings[bi]; const d=distRing(ic.x,ic.y,p[0]); if(d<nd){nd=d;near=buildings[bi];} }); });
  const baseH = owner ? owner.userData.h : 0;
  const [x,z] = toW(ic.x,ic.y);
  const g = new THREE.Group();
  const stickH = 3.2;
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,stickH,6), new THREE.MeshBasicMaterial({color:0x222222}));
  stick.position.y = stickH/2; g.add(stick);
  const dot = new THREE.Mesh(new THREE.CircleGeometry(.7,20), new THREE.MeshBasicMaterial({color:0x222222,transparent:true,opacity:.35}));
  dot.rotation.x=-Math.PI/2; dot.position.y=.05; g.add(dot);
  const sp = iconBox(iconTex[ic.t],1,1,.06,{depthTest:true}); spinners.push({o:sp,ph:Math.random()*Math.PI*2});
  sp.scale.set(4.2,4.2,1); sp.position.y = stickH+2; g.add(sp);
  g.position.set(x,baseH,z);
  const where = owner ? owner.userData.b.name+(owner.userData.b.id==='bus'?'':'（屋頂標示，代表樓內設施）') : (nd<4 && near ? near.userData.b.name+'旁' : '戶外');
  sp.userData.fac = {...ic, idx, where, owner, near: nd<4?near:null};
  g.userData = {type:ic.t, sprite:sp};
  scene.add(g); facObjs.push(g); pickables.push(sp);
});

/* 無障礙路線 */
let routeMat = new THREE.LineDashedMaterial({color:css('--route'),dashSize:1.1,gapSize:1.1,linewidth:2,depthTest:false,transparent:true});
const routeGroup = new THREE.Group(); routeGroup.renderOrder = 10;
DATA.routes.forEach(r=>{
  const pts = r.pts.map(p=>{const [x,z]=toW(p[0],p[1]);return new THREE.Vector3(x,.35,z);});
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(g,routeMat); line.computeLineDistances(); line.renderOrder=10; routeGroup.add(line);
  // 粗一點：再疊一條略偏移的線
  const pts2 = pts.map(v=>v.clone().add(new THREE.Vector3(.15,0,.15)));
  const l2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2),routeMat); l2.computeLineDistances(); l2.renderOrder=10; routeGroup.add(l2);
  // 箭頭：在靠近原圖箭頭的那一端
  const a = r.arrow; const s=r.pts[0], e=r.pts[r.pts.length-1];
  const atEnd = Math.hypot(a[0]-e[0],a[1]-e[1]) < Math.hypot(a[0]-s[0],a[1]-s[1]);
  const tip = atEnd ? e : s, prev = atEnd ? r.pts[Math.max(0,r.pts.length-3)] : r.pts[Math.min(2,r.pts.length-1)];
  const [tx,tz]=toW(tip[0],tip[1]), [px,pz]=toW(prev[0],prev[1]);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.9,2.2,12), new THREE.MeshBasicMaterial({color:css('--route'),depthTest:false,transparent:true}));
  cone.position.set(tx,.6,tz); cone.renderOrder=11;
  const dir = new THREE.Vector3(tx-px,0,tz-pz).normalize();
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  routeGroup.add(cone);
});
scene.add(routeGroup);


/* 標籤（HTML） */
const labelsEl = document.getElementById('labels');
buildings.forEach(g=>{
  const el=document.createElement('div'); el.className='blabel';
  const b=g.userData.b; el.innerHTML = b.name + (b.id==='bus'?'':'<small>'+g.userData.floors+'F</small>');
  el.addEventListener('click',()=>selectBuilding(g));
  labelsEl.appendChild(el); g.userData.label=el;
});

/* 圖例 */
const facList = document.getElementById('facList');
const facOn = {};
['entrance','ramp','elevator','wc','male','female','parking'].forEach(t=>{
  facOn[t]=true;
  const btn=document.createElement('button'); btn.className='fac'; btn.id='fac-'+t; btn.setAttribute('aria-pressed','true');
  btn.innerHTML=`<img alt="" src="${DATA.iconImg[t]}"><span class="full">${FAC[t].name}</span><span class="short" style="display:none">${FAC[t].short}</span><span class="n">${facCount[t]||0} 處</span>`;
  btn.onclick=()=>{facOn[t]=!facOn[t];btn.setAttribute('aria-pressed',facOn[t]);facObjs.forEach(o=>{if(o.userData.type===t)o.visible=facOn[t];});};
  facList.appendChild(btn);
});

/* 資訊面板 */
const info = document.getElementById('info');
function showOverview(){
  const total = DATA.icons.length; info.classList.add('ov');
  info.innerHTML = `<h2>校園概覽</h2><h3>6 棟建築・${total} 處無障礙設施</h3>
  <p>點選建築或名稱標籤，可查看該棟的無障礙設施；點圖示查看單一設施。藍色虛線是原圖標示的無障礙通路，箭頭為行進方向。</p>
  <p class="note">平面位置取自原始無障礙地圖；樓層數為估計值。</p>`;
}
let selected=null;
function selectBuilding(g){
  if(selected) { selected.userData.mat.color.set(selected.userData.b.id==='bus'?0xd8c9a0:0xf2c94c); selected.userData.label.classList.remove('sel'); }
  if(selected===g||!g){ selected=null; showOverview(); return; }
  selected=g; g.userData.mat.color.set(css('--sel')||'#e8793a'); g.userData.label.classList.add('sel');
  info.classList.remove('ov');
  const b=g.userData.b;
  const list = facObjs.map(o=>o.userData.sprite.userData.fac).filter(f=>f.owner===g||f.near===g);
  const by={}; list.forEach(f=>{by[f.t]=(by[f.t]||0)+1;});
  const items = Object.keys(FAC).filter(t=>by[t]).map(t=>`<li><img alt="" src="${DATA.iconImg[t]}">${FAC[t].name} × ${by[t]}</li>`).join('') || '<li>原圖未標示此棟的設施</li>';
  info.innerHTML = `<h2>建築</h2><h3>${b.name}</h3><p>${DESC[b.id]||''}</p>
  ${b.id==='bus'?'':`<p>約 ${g.userData.floors} 層樓（估計）</p>`}
  <h2 style="margin-top:4px">樓內與入口旁的無障礙設施</h2><ul>${items}</ul>
  <button id="bClose">回到概覽</button>`;
  document.getElementById('bClose').onclick=()=>selectBuilding(null);
  flyTo(g.userData.anchor, 120);
}
function showFac(f){
  if(selected) selectBuilding(null);
  info.classList.remove('ov');
  info.innerHTML = `<h2>無障礙設施</h2><h3 style="display:flex;gap:8px;align-items:center"><img alt="" src="${DATA.iconImg[f.t]}" style="width:28px;height:28px">${FAC[f.t].name}</h3>
  <p>位置：${f.where}</p><button id="bClose">回到概覽</button>`;
  document.getElementById('bClose').onclick=showOverview;
}
showOverview();

/* 相機 */
const HOME = {pos:new THREE.Vector3(-150,170,190), target:new THREE.Vector3(10,0,10)};
let anim=null;
function flyTo(target, dist, pos){
  const fromP=camera.position.clone(), fromT=controls.target.clone();
  const toT=target.clone().setY(0);
  const toP = pos || toT.clone().add(camera.position.clone().sub(controls.target).normalize().multiplyScalar(dist*(camera.aspect<1?1.9:1)));
  anim={t:0,fromP,fromT,toP,toT};
}
function resetView(){ topView=false; document.getElementById('bView').setAttribute('aria-pressed','false'); flyTo(HOME.target,0,HOME.pos); }
if(innerWidth<innerHeight) HOME.pos.multiplyScalar(1.7);
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);

/* 工具列 */
let topView=false;
const tog=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);fn(v);};};
tog('bView',v=>{topView=v; if(v) flyTo(new THREE.Vector3(10,0,0),0,new THREE.Vector3(10,330,1)); else resetView();});
document.getElementById('bReset').onclick=resetView;
tog('bSpin',v=>{controls.autoRotate=v;controls.autoRotateSpeed=0.8;});
tog('bRoute',v=>{routeGroup.visible=v;});
tog('bGhost',v=>{buildings.forEach(g=>{g.userData.mat.opacity=v?.35:1;g.userData.mat.depthWrite=!v;g.children.forEach(m=>{if(m.isMesh)m.castShadow=!v;});});});
tog('bLabel',v=>{labelsEl.hidden=!v;});

/* 點選與滑鼠提示 */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.getElementById('tip');
let down=null;
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables.filter(o=>{let p=o;while(p){if(!p.visible)return false;p=p.parent;}return true;}),false);
  return hits[0]?.object;
}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  const o=pick(e); if(!o){ if(selected) selectBuilding(null); return; }
  if(o.userData.fac) showFac(o.userData.fac); else if(o.userData.building) selectBuilding(o.userData.building);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'){tip.style.display='none';return;}
  const o=pick(e);
  if(o){ tip.textContent = o.userData.fac ? FAC[o.userData.fac.t].name : o.userData.building.userData.b.name;
    tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; renderer.domElement.style.cursor='pointer'; }
  else { tip.style.display='none'; renderer.domElement.style.cursor=''; }
});

/* 主迴圈 */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
applyTheme();
const v=new THREE.Vector3(); let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(anim){ anim.t=Math.min(1,anim.t+dt*1.6); const k=anim.t<.5?2*anim.t*anim.t:1-Math.pow(-2*anim.t+2,2)/2;
    camera.position.lerpVectors(anim.fromP,anim.toP,k); controls.target.lerpVectors(anim.fromT,anim.toT,k); if(anim.t>=1)anim=null; }
  controls.update();
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) routeMat.dashOffset -= dt*2.2;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const tt=now/1000;spinners=spinners.filter(q=>q.o.parent);spinners.forEach(q=>{q.o.rotation.y=q.ph+tt*(2*Math.PI/SPIN_PERIOD);});}
  renderer.render(scene,camera);
  if(!labelsEl.hidden){ const w=innerWidth,h=innerHeight;
    buildings.forEach(g=>{ v.copy(g.userData.anchor).project(camera); const el=g.userData.label;
      if(v.z>1){el.style.display='none';return;} el.style.display=''; el.style.left=((v.x+1)/2*w)+'px'; el.style.top=((1-v.y)/2*h)+'px'; }); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

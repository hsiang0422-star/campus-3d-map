<body>
<title>臺南特教校園 3D 地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen 3D felt board, slim header, floating control panel (right on desktop, bottom sheet on phone) */
:root{
  --bg:#e9dfcf; --scene:#e6dccb; --panel:#fffaf2; --ink:#3a3027; --muted:#7c6e60;
  --line:#e2d4c0; --accent:#d9452f; --chip:#f3eadc; --orange:#f08a3c;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f2226; --scene:#262a2f; --panel:#2c3036; --ink:#efe7db; --muted:#a99d8f;
  --line:#3b4048; --accent:#ff6b52; --chip:#363b42; --orange:#f59a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f2226; --scene:#262a2f; --panel:#2c3036; --ink:#efe7db; --muted:#a99d8f;
  --line:#3b4048; --accent:#ff6b52; --chip:#363b42; --orange:#f59a52; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px dashed var(--line);flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.35rem;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:.82rem;color:var(--ink);background:var(--chip);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;transform-origin:0 0;will-change:transform}
.lb.bld{font-family:var(--f-display);font-weight:700;font-size:15px;color:#3a3027;
  background:rgba(255,250,242,.86);padding:2px 8px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lb.bld.sel{background:#3a3027;color:#fffaf2}
.dpanel{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:300px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);
  overflow:auto;background:var(--panel);border:2px solid #b8322a;border-radius:14px;padding:0 12px 12px;box-shadow:0 8px 28px rgba(80,20,10,.22);z-index:6}
.dpanel.dragging{box-shadow:0 14px 40px rgba(80,20,10,.35)}
.dhead{color:#b8322a;font-weight:500}
.dcard{border:3px solid #b8322a;border-radius:6px;padding:8px;background:#fff;color:#2b2420}
.dcard img{display:block;width:100%;border-radius:3px}
.dcard .dt{font-weight:700;font-size:1.05rem;margin-top:8px}
.dcard p{margin:4px 0 0;color:#2b2420!important;font-size:.92rem;line-height:1.6}
.lb.pt.has-photo{background:#c0392b;outline:2px solid #fff;box-shadow:0 0 0 4px rgba(192,57,43,.35)}
.lb.pt{width:24px;height:24px;border-radius:50%;background:#f08a3c;color:#fff;font-weight:700;font-size:12px;
  display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.lb.nb{font-family:var(--f-display);font-size:14px;color:#5b5047;opacity:.85}
.lb.here{font-size:12px;font-weight:700;color:#d9452f;background:#fff;padding:2px 7px;border-radius:5px;border:1px solid #d9452f}
.lb.room{font-size:11px;font-weight:500;color:#3a3027;background:rgba(255,253,248,.9);padding:1px 6px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.lb.fl{font-family:var(--f-display);font-weight:700;font-size:14px;color:#fff;background:#8a5a44;padding:2px 8px;border-radius:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:5px 10px;font-size:.8rem}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:.76rem;color:var(--muted)}
.lg2 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lb.gate{font-family:var(--f-display);font-size:15px;font-weight:700;color:#d9452f}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:.78rem;padding:4px 8px;border-radius:6px;
  transform:translate(-50%,-130%);white-space:nowrap}
.panel{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:280px;max-height:calc(100% - 24px);overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px 14px;display:flex;flex-direction:column;
  box-shadow:0 6px 24px rgba(40,30,20,.12);z-index:3;min-width:220px;min-height:120px}
.panel.dragging{box-shadow:0 14px 40px rgba(40,30,20,.28);opacity:.97}
.phead{display:flex;align-items:center;gap:8px;padding:9px 0 8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  font-size:.75rem;color:var(--muted);border-bottom:1px dashed var(--line);margin-bottom:12px;flex:none}
.phead:active{cursor:grabbing}
.grip{width:22px;height:10px;flex:none;background:radial-gradient(circle,var(--muted) 1.2px,transparent 1.6px) 0 0/6px 5px;opacity:.7}
.collapse{margin-left:auto;font-size:.72rem;padding:3px 9px}
.pbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.pbody>*{flex-shrink:0}
.panel.min .pbody,.panel.min .presize{display:none}
.panel.min{height:auto!important;min-height:0;padding-bottom:0}
.panel.min .phead{border-bottom:0;margin-bottom:0}
.presize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,var(--muted) 50%,var(--muted) 56%,transparent 56%,transparent 68%,var(--muted) 68%,var(--muted) 74%,transparent 74%);opacity:.6;border-bottom-right-radius:14px}
.panel h2{font-family:var(--f-display);font-size:1rem;margin:0 0 6px;letter-spacing:.05em}
.bwrap{position:relative;z-index:20}
.bwrap .blist{position:fixed;z-index:50;width:340px;max-width:calc(100vw - 16px)}
.blist button{font-size:.8rem;padding:5px 12px}
.blist .collapse{font-size:.72rem;padding:3px 9px}
#bBld{font-weight:500}
#bBld[aria-expanded="true"]{background:var(--ink);color:var(--panel)}
.car{display:inline-block;transition:transform .2s}
[aria-expanded="true"] .car{transform:rotate(180deg)}
#bPanel[aria-expanded="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.blist{display:flex;flex-direction:column;width:340px;max-width:100%;max-height:60vh;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:0 12px 12px;box-shadow:0 8px 28px rgba(40,30,20,.16)}
.blist{position:fixed}
.blist .bitems{flex:1;align-content:flex-start;padding-bottom:10px}
.blist .presize{border-bottom-right-radius:12px}
.blist.dragging{box-shadow:0 14px 40px rgba(40,30,20,.28)}
.bitems{display:flex;flex-wrap:wrap;gap:6px;overflow:auto;min-height:0}
.blist button{font-size:.8rem;padding:5px 12px}
.blist button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.topbar{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:308px;display:flex;gap:6px;
  overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;z-index:2}
.topbar button{flex:none;font-size:.8rem;padding:5px 12px;background:var(--panel);box-shadow:0 2px 8px rgba(40,30,20,.12)}
.topbar button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
@media (max-width:700px){.topbar{right:max(12px,env(safe-area-inset-right,0px))}}
.info{border-top:1px dashed var(--line);padding-top:12px;min-height:64px}
.info .name{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.info p{margin:4px 0;font-size:.84rem;color:var(--muted);line-height:1.6}
.info .facs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.info .facs span{font-size:.75rem;background:var(--chip);border-radius:6px;padding:2px 7px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.78rem;color:var(--muted)}
.legend .ico{width:20px;height:20px;margin-right:6px;vertical-align:-5px;border-radius:4px}
.legend span{display:flex;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toggles{display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.toggles label{display:flex;align-items:center;gap:8px;cursor:pointer}
.hint{font-size:.74rem;color:var(--muted);line-height:1.5}
.ctrl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;width:196px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:0 12px 12px;box-shadow:0 6px 24px rgba(40,30,20,.12);z-index:3}
.ctrl.dragging{box-shadow:0 14px 40px rgba(40,30,20,.28)}
.ctrl.min .cbody{display:none}
.ctrl.min{padding-bottom:0}.ctrl.min .phead{border-bottom:0;margin-bottom:0}
.cbody{display:flex;flex-direction:column;gap:10px}
.cbody h3{font-size:.72rem;font-weight:500;color:var(--muted);margin:0 0 4px;letter-spacing:.08em}
.pad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,34px);gap:4px;justify-content:center}
.pad button,.crow button{padding:0;border-radius:9px;font-size:1rem;line-height:1;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.crow button{height:32px;font-size:.8rem}
.cmode{display:flex;gap:4px}.cmode button{flex:1;padding:5px 0;font-size:.78rem}
@media (max-width:700px){
  .panel{top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    width:auto;max-height:46%;padding:0 12px 12px}
  h1 small{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>臺南特教校園 3D 地圖<small>拖曳旋轉・Shift＋拖曳平移・滾輪縮放・雙指可平移</small></h1>
    <div class="tools">
      <button id="bReset">重設視角</button>
      <button id="bTop">俯視</button>
      <button id="bCtrl" aria-pressed="true">地圖操作</button>
      <button id="bLbl" aria-pressed="false">建築名稱</button>

      <div class="bwrap" id="bwrap">
        <button id="bBld" aria-expanded="false" aria-controls="chips">各建築場域 <span class="car" aria-hidden="true">▾</span></button>

          <div class="phead" id="bhead" title="拖曳移動，雙擊回到按鈕下方"><span class="grip" aria-hidden="true"></span>各建築場域・拖曳移動<button class="collapse" id="bClose">收合</button></div>
          <nav class="bitems" id="chips" aria-label="各建築場域"></nav>
          <div class="presize" id="bsize" title="拖曳調整大小"></div>
        </div>
      </div>
    </div>
  </header>
  <div class="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="ctrl" id="ctrl">
      <div class="phead" id="chead" title="拖曳移動，雙擊回到原位"><span class="grip" aria-hidden="true"></span>地圖操作<button class="collapse" id="cMin">收合</button></div>
      <div class="cbody">
        <div><h3>平移（按住連續移動）</h3>
          <div class="pad">
            <span></span><button data-act="pan" data-x="0" data-z="1" aria-label="往前平移">▲</button><span></span>
            <button data-act="pan" data-x="-1" data-z="0" aria-label="往左平移">◀</button><button id="cHome" aria-label="重設視角" title="重設視角">⌂</button><button data-act="pan" data-x="1" data-z="0" aria-label="往右平移">▶</button>
            <span></span><button data-act="pan" data-x="0" data-z="-1" aria-label="往後平移">▼</button><span></span>
          </div></div>
        <div><h3>旋轉・角度</h3>
          <div class="crow">
            <button data-act="rot" data-v="1">⟲ 左轉</button><button data-act="rot" data-v="-1">右轉 ⟳</button>
            <button data-act="tilt" data-v="-1">抬高視角</button><button data-act="tilt" data-v="1">壓低視角</button>
          </div></div>
        <div><h3>縮放</h3>
          <div class="crow"><button data-act="zoom" data-v="-1">＋ 放大</button><button data-act="zoom" data-v="1">－ 縮小</button></div></div>
        <div><h3>滑鼠左鍵／單指拖曳</h3>
          <div class="cmode" id="cmode"><button data-m="rotate" aria-pressed="true">旋轉</button><button data-m="pan" aria-pressed="false">平移</button></div></div>
      </div>
    </div>
    <div id="tip" hidden></div>
    <aside class="dpanel" id="dpanel" hidden aria-label="危險角落資訊">
      <div class="phead dhead" id="dhead" title="拖曳移動，雙擊回到原位"><span class="grip" aria-hidden="true"></span>危險角落資訊・拖曳移動<button class="collapse" id="dClose">關閉</button></div>
      <div class="dbody" id="dbody"></div>
    </aside>
    <aside class="panel" id="panel">
      <div class="phead" id="phead" title="拖曳移動，雙擊回到原位"><span class="grip" aria-hidden="true"></span>資訊面板・拖曳移動<button class="collapse" id="bMin">收合</button></div>
      <div class="pbody">
      <div>
        <h2>教學大樓樓層</h2>
        <div class="seg" id="seg">
          <button data-m="ext" aria-pressed="true">外觀</button>
          <button data-m="1" aria-pressed="false">1F</button>
          <button data-m="2" aria-pressed="false">2F</button>
          <button data-m="3" aria-pressed="false">3F</button>
          <button data-m="4" aria-pressed="false">4F</button>
          <button data-m="exp" aria-pressed="false">分層展開</button>
        </div>
      </div>
      <div class="info" id="info">
        <p>選樓層看教室配置，點任一間教室可看名稱與面積。</p>
      </div>
      </div>
      <div class="presize" id="presize" title="拖曳調整大小"></div>
    </aside>
  </div>
</div>

/* ---------- felt texture ---------- */
function feltTex(rep){
  const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');
  g.fillStyle='#f2f2f2';g.fillRect(0,0,s,s);
  for(let i=0;i<5000;i++){const v=200+Math.random()*55|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(Math.random()*s,Math.random()*s,1.5,1.5);}
  g.lineWidth=0.6;
  for(let i=0;i<900;i++){const v=215+Math.random()*40|0;g.strokeStyle=`rgba(${v},${v},${v},.7)`;
    const x=Math.random()*s,y=Math.random()*s,a=Math.random()*6.28,l=3+Math.random()*7;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*.5,y+Math.sin(a+1)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.encoding=THREE.sRGBEncoding;return t;
}
const FT=feltTex(1.2), FTB=feltTex(1.2); FTB.encoding=THREE.LinearEncoding;
const matCache={};
function felt(color){
  if(!matCache[color]) matCache[color]=new THREE.MeshStandardMaterial({color,map:FT,bumpMap:FTB,bumpScale:0.025,roughness:1,metalness:0});
  return matCache[color];
}

/* ---------- geometry helpers ---------- */
function rrShape(x0,z0,x1,z1,r){
  const [a,b]=P(x0,z0),[c,d]=P(x1,z1); r=Math.min(r,(c-a)/2,(d-b)/2);
  const s=new THREE.Shape(); // shape coords: (x, -z)
  s.moveTo(a+r,-b); s.lineTo(c-r,-b); s.quadraticCurveTo(c,-b,c,-b-r);
  s.lineTo(c,-d+r); s.quadraticCurveTo(c,-d,c-r,-d); s.lineTo(a+r,-d);
  s.quadraticCurveTo(a,-d,a,-d+r); s.lineTo(a,-b-r); s.quadraticCurveTo(a,-b,a+r,-b); return s;
}
function polyShape(pts){const s=new THREE.Shape();pts.forEach(([x,z],i)=>{const[a,b]=P(x,z);i?s.lineTo(a,-b):s.moveTo(a,-b)});return s;}
function extrude(shape,h,bevel){
  const g=new THREE.ExtrudeGeometry(shape,{depth:Math.max(h-(bevel?0.12:0),0.01),bevelEnabled:!!bevel,bevelThickness:0.06,bevelSize:0.06,bevelSegments:3,curveSegments:8});
  g.rotateX(-Math.PI/2); if(bevel)g.translate(0,0.06,0); return g;
}
function flat(shape,color,y,h=0.04){const m=new THREE.Mesh(extrude(shape,h,false),felt(color));m.position.y=y;m.receiveShadow=true;scene.add(m);return m;}

const icoCache={};
function iconCanvas(t){
  if(icoCache[t])return icoCache[t];
  const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');
  g.fillStyle='#'+FACCOL[t].toString(16).padStart(6,'0');
  g.beginPath();g.roundRect?g.roundRect(4,4,120,120,18):g.rect(4,4,120,120);g.fill();
  const ink=(t==='s'||t==='d')?'#2b2520':'#ffffff';g.fillStyle=ink;g.strokeStyle=ink;g.lineCap='round';g.lineJoin='round';
  if(t==='s'||t==='d'){
    // staircase silhouette
    g.beginPath();g.moveTo(18,110);g.lineTo(18,90);g.lineTo(42,90);g.lineTo(42,70);g.lineTo(66,70);g.lineTo(66,50);g.lineTo(90,50);g.lineTo(90,30);g.lineTo(110,30);g.lineTo(110,110);g.closePath();g.fill();
    // arrow
    g.lineWidth=8;const up=t==='s';
    const [x0,y0,x1,y1]=up?[20,72,56,36]:[56,36,20,72];
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    const ang=Math.atan2(y1-y0,x1-x0);g.beginPath();g.moveTo(x1,y1);
    g.lineTo(x1-20*Math.cos(ang-0.5),y1-20*Math.sin(ang-0.5));g.lineTo(x1-20*Math.cos(ang+0.5),y1-20*Math.sin(ang+0.5));g.closePath();g.fill();
  }else if(t==='m'){
    g.beginPath();g.arc(64,24,13,0,Math.PI*2);g.fill();
    g.beginPath();g.roundRect?g.roundRect(42,42,44,42,10):g.rect(42,42,44,42);g.fill();
    g.fillRect(48,74,13,44);g.fillRect(67,74,13,44);
  }else if(t==='f'){
    g.beginPath();g.arc(64,24,13,0,Math.PI*2);g.fill();
    g.beginPath();g.moveTo(52,42);g.lineTo(76,42);g.lineTo(94,94);g.lineTo(34,94);g.closePath();g.fill();
    g.fillRect(51,90,11,28);g.fillRect(66,90,11,28);
  }else if(t==='g'){
    // all-gender toilet: one figure, trousered on the left half and skirted on the right half
    g.beginPath();g.arc(64,22,13,0,Math.PI*2);g.fill();
    g.fillRect(44,40,20,40);g.fillRect(46,76,13,42);
    g.beginPath();g.moveTo(64,40);g.lineTo(76,40);g.lineTo(90,92);g.lineTo(64,92);g.closePath();g.fill();
    g.fillRect(68,90,10,28);
    g.fillStyle='#8a6fc0';g.fillRect(62,36,4,84);
  }else if(t==='a'){
    g.lineWidth=9;g.beginPath();g.arc(58,86,24,0,Math.PI*2);g.stroke();
    g.beginPath();g.arc(60,20,10,0,Math.PI*2);g.fill();
    g.beginPath();g.moveTo(58,34);g.lineTo(58,70);g.lineTo(88,70);g.lineTo(100,98);g.stroke();
    g.beginPath();g.moveTo(58,50);g.lineTo(84,50);g.stroke();
  }else if(t==='e'){
    g.beginPath();g.moveTo(64,18);g.lineTo(94,56);g.lineTo(34,56);g.closePath();g.fill();
    g.beginPath();g.moveTo(64,110);g.lineTo(94,72);g.lineTo(34,72);g.closePath();g.fill();
  }
  return icoCache[t]=cv;
}

  function clampApply(r){
    const W=stage.clientWidth,H=stage.clientHeight;
    if(r.w){r.w=Math.min(Math.max(220,r.w),W-8);panel.style.width=r.w+'px';}
    if(r.h){r.h=Math.min(Math.max(120,r.h),H-8);panel.style.height=r.h+'px';panel.style.maxHeight='none';}
    const pw=panel.offsetWidth,ph=panel.offsetHeight;
    r.x=Math.min(Math.max(4,r.x),Math.max(4,W-pw-4));r.y=Math.min(Math.max(4,r.y),Math.max(4,H-ph-4));
    Object.assign(panel.style,{left:r.x+'px',top:r.y+'px',right:'auto',bottom:'auto'});
    return r;
  }
  function cur(){const a=panel.getBoundingClientRect(),b=stage.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};}
  let sized=false;
  function save(){try{const c=cur();if(!sized){delete c.w;delete c.h;}localStorage.setItem(KEY,JSON.stringify(c));}catch(e){}}
  try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){sized=!!r.w;clampApply(r);}}catch(e){}
  let st=null;
  head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const c=cur();st={mode:'move',sx:e.clientX,sy:e.clientY,c};head.setPointerCapture(e.pointerId);panel.classList.add('dragging');e.preventDefault();});
  grip.addEventListener('pointerdown',e=>{sized=true;const c=cur();st={mode:'size',sx:e.clientX,sy:e.clientY,c};grip.setPointerCapture(e.pointerId);panel.classList.add('dragging');e.preventDefault();});
  function move(e){if(!st)return;const dx=e.clientX-st.sx,dy=e.clientY-st.sy;
    if(st.mode==='move')clampApply({x:st.c.x+dx,y:st.c.y+dy});
    else clampApply({x:st.c.x,y:st.c.y,w:st.c.w+dx,h:st.c.h+dy});}
  function end(){if(!st)return;st=null;panel.classList.remove('dragging');save();}
  [head,grip].forEach(el=>{el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);});
  head.addEventListener('dblclick',e=>{if(e.target.closest('button'))return;['left','top','right','bottom','width','height','maxHeight'].forEach(k=>panel.style[k]='');sized=false;try{localStorage.removeItem(KEY);}catch(_){}});
  new ResizeObserver(()=>{if(panel.style.left){const c=cur();clampApply({x:c.x,y:c.y});}}).observe(stage);
})();

/* ---------- movable map-control panel ---------- */
(function(){
  const box=document.getElementById('ctrl'),head=document.getElementById('chead'),stage=box.parentElement;
  const off=new THREE.Vector3(),sph=new THREE.Spherical();
  function act(a,x,z,v){
    fly=null;off.copy(camera.position).sub(controls.target);
    if(a==='pan'){const fwd=off.clone().setY(0).normalize().negate(),right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0));
      const step=0.012*off.length();const d=fwd.multiplyScalar(z*step).add(right.multiplyScalar(x*step));
      controls.target.add(d);camera.position.add(d);}
    else if(a==='rot'){off.applyAxisAngle(new THREE.Vector3(0,1,0),v*0.03);camera.position.copy(controls.target).add(off);}
    else if(a==='tilt'){sph.setFromVector3(off);sph.phi=Math.min(controls.maxPolarAngle,Math.max(0.12,sph.phi+v*0.025));off.setFromSpherical(sph);camera.position.copy(controls.target).add(off);}
    else if(a==='zoom'){const L=off.length(),n=Math.min(controls.maxDistance,Math.max(controls.minDistance,L*(1+v*0.03)));off.setLength(n);camera.position.copy(controls.target).add(off);}
  }
  let hold=null;
  function stop(){if(hold){cancelAnimationFrame(hold.raf);hold=null;}}
  box.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();stop();b.setPointerCapture(e.pointerId);
      const run=()=>{act(b.dataset.act,+(b.dataset.x||0),+(b.dataset.z||0),+(b.dataset.v||0));hold.raf=requestAnimationFrame(run);};
      hold={raf:0};run();});
    ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,stop));
  });
  document.getElementById('cHome').onclick=()=>flyTo(HOME.pos.clone(),HOME.target.clone());
  // left-drag / one-finger mode
  box.querySelectorAll('#cmode button').forEach(b=>b.onclick=()=>{
    const pan=b.dataset.m==='pan';
    controls.mouseButtons.LEFT=pan?THREE.MOUSE.PAN:THREE.MOUSE.ROTATE;
    controls.touches.ONE=pan?THREE.TOUCH.PAN:THREE.TOUCH.ROTATE;
    box.querySelectorAll('#cmode button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  // collapse / show
  const cMin=document.getElementById('cMin');
  const setMin=on=>{box.classList.toggle('min',on);cMin.textContent=on?'展開':'收合';};
  cMin.onclick=()=>setMin(!box.classList.contains('min'));
  if(innerWidth<=700)setMin(true);
  const bCtrl=document.getElementById('bCtrl');
  bCtrl.onclick=()=>{box.hidden=!box.hidden;bCtrl.setAttribute('aria-pressed',!box.hidden);if(!box.hidden)setMin(false);};
  // drag to move, remembered per browser
  const KEY='campus3d-ctrl';
  function place(x,y){const W=stage.clientWidth,H=stage.clientHeight;x=Math.min(Math.max(4,x),Math.max(4,W-box.offsetWidth-4));y=Math.min(Math.max(4,y),Math.max(4,H-box.offsetHeight-4));
    Object.assign(box.style,{left:x+'px',top:y+'px'});return{x,y};}
  try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)place(r.x,r.y);}catch(e){}
  let st=null;
  head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const a=box.getBoundingClientRect(),s=stage.getBoundingClientRect();
    st={sx:e.clientX,sy:e.clientY,x:a.left-s.left,y:a.top-s.top};head.setPointerCapture(e.pointerId);box.classList.add('dragging');e.preventDefault();});
  head.addEventListener('pointermove',e=>{if(st)st.last=place(st.x+e.clientX-st.sx,st.y+e.clientY-st.sy);});
  const end=()=>{if(!st)return;box.classList.remove('dragging');if(st.last)try{localStorage.setItem(KEY,JSON.stringify(st.last));}catch(e){}st=null;};
  head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
  head.addEventListener('dblclick',e=>{if(e.target.closest('button'))return;box.style.left='';box.style.top='';try{localStorage.removeItem(KEY);}catch(_){}});
  new ResizeObserver(()=>{if(box.style.left){const a=box.getBoundingClientRect(),s=stage.getBoundingClientRect();place(a.left-s.left,a.top-s.top);}}).observe(stage);
})();

/* ---------- loop ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<600?50:38;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas);resize();
function loop(now){
  if(fly){let t=Math.min(1,(now-fly.s)/fly.ms);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(t>=1)fly=null;}
  Object.values(floorObjs).forEach(o=>{o.grp.position.y+=(o.targetY-o.grp.position.y)*(reduce?1:0.14);});
  controls.target.x=Math.max(-15,Math.min(15,controls.target.x));controls.target.z=Math.max(-9,Math.min(9,controls.target.z));controls.target.y=Math.max(0,Math.min(6,controls.target.y));
  controls.update();
  renderer.render(scene,camera);placeLabels();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<title>臺南特教校園 3D 地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen 3D felt board, slim header, floating control panel (right on desktop, bottom sheet on phone) */
:root{
  --bg:#e9dfcf; --scene:#e6dccb; --panel:#fffaf2; --ink:#3a3027; --muted:#7c6e60;
  --line:#e2d4c0; --accent:#d9452f; --chip:#f3eadc; --orange:#f08a3c;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f2226; --scene:#262a2f; --panel:#2c3036; --ink:#efe7db; --muted:#a99d8f;
  --line:#3b4048; --accent:#ff6b52; --chip:#363b42; --orange:#f59a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f2226; --scene:#262a2f; --panel:#2c3036; --ink:#efe7db; --muted:#a99d8f;
  --line:#3b4048; --accent:#ff6b52; --chip:#363b42; --orange:#f59a52; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px dashed var(--line);flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.35rem;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:.82rem;color:var(--ink);background:var(--chip);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;transform-origin:0 0;will-change:transform}
.lb.bld{font-family:var(--f-display);font-weight:700;font-size:15px;color:#3a3027;
  background:rgba(255,250,242,.86);padding:2px 8px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lb.bld.sel{background:#3a3027;color:#fffaf2}
.lb.pt{width:24px;height:24px;border-radius:50%;background:#f08a3c;color:#fff;font-weight:700;font-size:12px;
  display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.lb.nb{font-family:var(--f-display);font-size:14px;color:#5b5047;opacity:.85}
.lb.here{font-size:12px;font-weight:700;color:#d9452f;background:#fff;padding:2px 7px;border-radius:5px;border:1px solid #d9452f}
.lb.room{font-size:11px;font-weight:500;color:#3a3027;background:rgba(255,253,248,.9);padding:1px 6px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.lb.fl{font-family:var(--f-display);font-weight:700;font-size:14px;color:#fff;background:#8a5a44;padding:2px 8px;border-radius:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:5px 10px;font-size:.8rem}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:.76rem;color:var(--muted)}
.lg2 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lb.gate{font-family:var(--f-display);font-size:15px;font-weight:700;color:#d9452f}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:.78rem;padding:4px 8px;border-radius:6px;
  transform:translate(-50%,-130%);white-space:nowrap}
.panel{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:280px;max-height:calc(100% - 24px);overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px 14px;display:flex;flex-direction:column;
  box-shadow:0 6px 24px rgba(40,30,20,.12);z-index:3;min-width:220px;min-height:120px}
.panel.dragging{box-shadow:0 14px 40px rgba(40,30,20,.28);opacity:.97}
.phead{display:flex;align-items:center;gap:8px;padding:9px 0 8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  font-size:.75rem;color:var(--muted);border-bottom:1px dashed var(--line);margin-bottom:12px;flex:none}
.phead:active{cursor:grabbing}
.grip{width:22px;height:10px;flex:none;background:radial-gradient(circle,var(--muted) 1.2px,transparent 1.6px) 0 0/6px 5px;opacity:.7}
.collapse{margin-left:auto;font-size:.72rem;padding:3px 9px}
.pbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.pbody>*{flex-shrink:0}
.panel.min .hide-min{display:none}
.presize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,var(--muted) 50%,var(--muted) 56%,transparent 56%,transparent 68%,var(--muted) 68%,var(--muted) 74%,transparent 74%);opacity:.6;border-bottom-right-radius:14px}
.panel h2{font-family:var(--f-display);font-size:1rem;margin:0 0 6px;letter-spacing:.05em}
.topbar{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:308px;display:flex;gap:6px;
  overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;z-index:2}
.topbar button{flex:none;font-size:.8rem;padding:5px 12px;background:var(--panel);box-shadow:0 2px 8px rgba(40,30,20,.12)}
.topbar button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
@media (max-width:700px){.topbar{right:max(12px,env(safe-area-inset-right,0px))}}
.info{border-top:1px dashed var(--line);padding-top:12px;min-height:64px}
.info .name{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.info p{margin:4px 0;font-size:.84rem;color:var(--muted);line-height:1.6}
.info .facs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.info .facs span{font-size:.75rem;background:var(--chip);border-radius:6px;padding:2px 7px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.78rem;color:var(--muted)}
.legend .ico{width:20px;height:20px;margin-right:6px;vertical-align:-5px;border-radius:4px}
.legend span{display:flex;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toggles{display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.toggles label{display:flex;align-items:center;gap:8px;cursor:pointer}
.hint{font-size:.74rem;color:var(--muted);line-height:1.5}
@media (max-width:700px){
  .panel{top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    width:auto;max-height:46%;padding:0 12px 12px}
  h1 small{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>臺南特教校園 3D 地圖<small>拖曳旋轉・Shift＋拖曳平移・滾輪縮放・雙指可平移</small></h1>
    <div class="tools">

      <div class="phead" id="phead" title="拖曳移動，雙擊回到原位"><span class="grip" aria-hidden="true"></span>資訊面板・拖曳移動<button class="collapse" id="bMin">收合</button></div>
      <div class="pbody">

      </div>
      <div>
        <h2>教學大樓樓層</h2>
        <div class="seg" id="seg">
          <button data-m="ext" aria-pressed="true">外觀</button>
          <button data-m="1" aria-pressed="false">1F</button>
          <button data-m="2" aria-pressed="false">2F</button>
          <button data-m="3" aria-pressed="false">3F</button>
          <button data-m="4" aria-pressed="false">4F</button>
          <button data-m="exp" aria-pressed="false">分層展開</button>
        </div>
      </div>
      <div class="hide-min">
        <h2>圖層</h2>
        <div class="toggles">
          <label><input type="checkbox" id="tFac" checked> 電梯・樓梯・廁所</label>

      </div>
      <div class="hide-min">
        <h2>圖例</h2>
        <div class="legend">
          <span><img class="ico" data-ico="e" alt="">電梯</span>
          <span><img class="ico" data-ico="m" alt="">男廁</span>
          <span><img class="ico" data-ico="s" alt="">樓梯（往上）</span>
          <span><img class="ico" data-ico="f" alt="">女廁</span>
          <span><img class="ico" data-ico="d" alt="">樓梯（往下）</span>
          <span><i style="background:#f08a3c;border-radius:50%"></i>校園危險角落</span>
        </div>
        <h2 style="margin-top:12px">教室類型</h2>
        <div class="lg2">
          <span><i style="background:#f6d27a"></i>一般教室</span>
          <span><i style="background:#f3b37e"></i>教師室</span>
          <span><i style="background:#9fd0a8"></i>專科・治療</span>
          <span><i style="background:#b9a7e0"></i>行政・辦公</span>
          <span><i style="background:#c9c3bb"></i>設備・儲藏</span>
          <span><i style="background:#d9e6c8"></i>陽台・露台</span>
        </div>
        <p class="hint">位置依平面圖比例估算，供導覽與簡報使用，非實測尺寸。</p>
      </div>
      </div>
      <div class="presize" id="presize" title="拖曳調整大小"></div>
    </aside>
  </div>
</div>

/* ---------- felt texture ---------- */

function rrShape(x0,z0,x1,z1,r){
  const [a,b]=P(x0,z0),[c,d]=P(x1,z1); r=Math.min(r,(c-a)/2,(d-b)/2);
  const s=new THREE.Shape(); // shape coords: (x, -z)
  s.moveTo(a+r,-b); s.lineTo(c-r,-b); s.quadraticCurveTo(c,-b,c,-b-r);
  s.lineTo(c,-d+r); s.quadraticCurveTo(c,-d,c-r,-d); s.lineTo(a+r,-d);
  s.quadraticCurveTo(a,-d,a,-d+r); s.lineTo(a,-b-r); s.quadraticCurveTo(a,-b,a+r,-b); return s;
}

  focusB(id,true);
  document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));
  const c=b.center.clone();c.y=0;
  const dir=camera.position.clone().sub(controls.target).normalize();
  flyTo(c.clone().add(dir.multiplyScalar(9)).setY(Math.max(5,b.top+5)),c,reduce?1:900);
}
const chips=document.getElementById('chips');
BUILDINGS.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.name;btn.dataset.id=b.id;btn.setAttribute('aria-pressed','false');btn.onclick=()=>select(b.id);
  btn.onmouseenter=btn.onfocus=()=>focusB(b.id,true);btn.onmouseleave=btn.onblur=()=>{if(selected!==b.id)focusB(b.id,false);};chips.appendChild(btn);});

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById('tip');
let hoverId=null,downXY=null;
function pick(e){const r=canvas.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(pickables.filter(visDeep),false);return hits[0]&&hits[0].object.userData;}
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const u=pick(e);const r=canvas.getBoundingClientRect();
  if(u){tip.hidden=false;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';
    tip.textContent=u.kind==='b'?bMeta[u.id].name:u.kind==='r'?`${u.f}F・${FLOORS[u.f].rooms[u.i][5]}`:`${FACNAME[u.t]}・${bMeta[u.bid].name}`;canvas.style.cursor='pointer';}
  else{tip.hidden=true;canvas.style.cursor='grab';}
});
canvas.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{if(!downXY||Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>6)return;
  const u=pick(e);if(!u)return;if(u.kind==='r'){showRoom(u.f,u.i);return;}select(u.kind==='b'?u.id:u.bid);});
canvas.addEventListener('pointerleave',()=>tip.hidden=true);

/* ---------- controls UI ---------- */
document.getElementById('bReset').onclick=()=>flyTo(HOME.pos.clone(),HOME.target.clone());
document.getElementById('bTop').onclick=()=>flyTo(new THREE.Vector3(0.5,30,0.9),new THREE.Vector3(0.5,0,0.8));
const bSpin=document.getElementById('bSpin');
bSpin.onclick=()=>{controls.autoRotate=!controls.autoRotate;bSpin.setAttribute('aria-pressed',controls.autoRotate);};
const bPts=document.getElementById('bPts');
bPts.onclick=()=>{show.pts=!show.pts;pinGroup.visible=show.pts;bPts.setAttribute('aria-pressed',show.pts);};
document.getElementById('tFac').onchange=e=>{facGroup.visible=e.target.checked;};
document.getElementById('tLbl').onchange=e=>{show.lbl=e.target.checked;BUILDINGS.forEach(b=>leadVis(b.id));};
const panel=document.getElementById('panel');
document.getElementById('bMin').onclick=e=>{panel.classList.toggle('min');e.target.textContent=panel.classList.contains('min')?'展開':'收合';};
if(innerWidth<=700)panel.classList.add('min'),document.getElementById('bMin').textContent='展開';

/* ---------- draggable, resizable info panel ---------- */
(function(){
  const stage=panel.parentElement, head=document.getElementById('phead'), grip=document.getElementById('presize');
  const KEY='campus3d-panel';
  function clampApply(r){
    const W=stage.clientWidth,H=stage.clientHeight;
    if(r.w){r.w=Math.min(Math.max(220,r.w),W-8);panel.style.width=r.w+'px';}
    if(r.h){r.h=Math.min(Math.max(120,r.h),H-8);panel.style.height=r.h+'px';panel.style.maxHeight='none';}
    const pw=panel.offsetWidth,ph=panel.offsetHeight;
    r.x=Math.min(Math.max(4,r.x),Math.max(4,W-pw-4));r.y=Math.min(Math.max(4,r.y),Math.max(4,H-ph-4));
    Object.assign(panel.style,{left:r.x+'px',top:r.y+'px',right:'auto',bottom:'auto'});
    return r;
  }
  function cur(){const a=panel.getBoundingClientRect(),b=stage.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};}
  let sized=false;
  function save(){try{const c=cur();if(!sized){delete c.w;delete c.h;}localStorage.setItem(KEY,JSON.stringify(c));}catch(e){}}
  try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){sized=!!r.w;clampApply(r);}}catch(e){}
  let st=null;
  head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const c=cur();st={mode:'move',sx:e.clientX,sy:e.clientY,c};head.setPointerCapture(e.pointerId);panel.classList.add('dragging');e.preventDefault();});
  grip.addEventListener('pointerdown',e=>{sized=true;const c=cur();st={mode:'size',sx:e.clientX,sy:e.clientY,c};grip.setPointerCapture(e.pointerId);panel.classList.add('dragging');e.preventDefault();});
  function move(e){if(!st)return;const dx=e.clientX-st.sx,dy=e.clientY-st.sy;
    if(st.mode==='move')clampApply({x:st.c.x+dx,y:st.c.y+dy});
    else clampApply({x:st.c.x,y:st.c.y,w:st.c.w+dx,h:st.c.h+dy});}
  function end(){if(!st)return;st=null;panel.classList.remove('dragging');save();}
  [head,grip].forEach(el=>{el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);});
  head.addEventListener('dblclick',e=>{if(e.target.closest('button'))return;['left','top','right','bottom','width','height','maxHeight'].forEach(k=>panel.style[k]='');sized=false;try{localStorage.removeItem(KEY);}catch(_){}});
  new ResizeObserver(()=>{if(panel.style.left){const c=cur();clampApply({x:c.x,y:c.y});}}).observe(stage);
})();

/* ---------- loop ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<600?50:38;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas);resize();
function loop(now){
  if(fly){let t=Math.min(1,(now-fly.s)/fly.ms);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(t>=1)fly=null;}
  Object.values(floorObjs).forEach(o=>{o.grp.position.y+=(o.targetY-o.grp.position.y)*(reduce?1:0.14);});
  controls.target.x=Math.max(-15,Math.min(15,controls.target.x));controls.target.z=Math.max(-9,Math.min(9,controls.target.z));controls.target.y=Math.max(0,Math.min(6,controls.target.y));
  controls.update();
  renderer.render(scene,camera);placeLabels();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
